<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Infinite Trading Intelligence</title><style>body{font-family:system-ui,sans-serif;max-width:960px;margin:40px auto;padding:0 20px;background:#0b1020;color:#eef2ff}main{display:grid;gap:16px}.card{background:#151c33;border:1px solid #293454;border-radius:14px;padding:20px}.muted{color:#aab4d0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.value{font-size:28px;font-weight:700}</style></head><body><main><header><h1>Infinite Trading Intelligence</h1><p class="muted">Read-only portfolio and market intelligence MVP</p></header><section class="grid"><div class="card"><div class="muted">Mode</div><div class="value">READ ONLY</div></div><div class="card"><div class="muted">Execution</div><div class="value">DISABLED</div></div><div class="card"><div class="muted">Risk</div><div class="value" id="risk">—</div></div></section><section class="card"><h2>Portfolio analyzer</h2><p class="muted">Demo calculation uses supplied holdings only. No wallet connection and no funds movement.</p><button id="demo">Analyze demo portfolio</button><pre id="out"></pre></section></main><script>document.getElementById('demo').onclick=async()=>{const r=await fetch('/v1/portfolio/analyze',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({holdings:[{symbol:'ETH',quantity:2,price_usd:2000},{symbol:'USDC',quantity:1000,price_usd:1}]})});const d=await r.json();document.getElementById('risk').textContent=d.risk_score;document.getElementById('out').textContent=JSON.stringify(d,null,2)}</script></body></html>
